apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: faiss-data
  namespace: doqflow
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-module
  namespace: doqflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-module
  template:
    metadata:
      labels:
        app: ai-module
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ai-module
          image: ghcr.io/doqflowai/doqflow-ai:ab4530e08864a5eb6ccece59968808d1d298178b
          ports:
            - containerPort: 8000
          env:
            - name: AI_INTERNAL_KEY
              valueFrom: { secretKeyRef: { name: doqflow-secrets, key: AI_INTERNAL_KEY } }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: doqflow-secrets, key: OPENAI_API_KEY } }
            - name: EMBEDDING_MODEL
              valueFrom: { configMapKeyRef: { name: doqflow-config, key: EMBEDDING_MODEL } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: faiss-data
              mountPath: /app/faiss
            - name: upload-data
              mountPath: /app/uploads
              readOnly: true
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: 8000 }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: faiss-data
          persistentVolumeClaim:
            claimName: faiss-data
        - name: upload-data
          persistentVolumeClaim:
            claimName: upload-data
---
apiVersion: v1
kind: Service
metadata:
  name: ai-module
  namespace: doqflow
spec:
  type: ClusterIP
  selector:
    app: ai-module
  ports:
    - port: 8000
      targetPort: 8000