server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 보안 헤더 (화면 쪽). TODO: CSP 정책은 보안점검서에서 확정 후 추가
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 브라우저는 /api 로만 요청한다. Backend 포트는 FE 코드에 넣지 않는다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 220m;   # 20MB x 10개 업로드
        proxy_read_timeout 300s;
    }

    # 질의응답 스트리밍(SSE): 버퍼링을 끄지 않으면 토큰이 한꺼번에 도착한다
    location = /api/ai/chat {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # 해시가 붙은 정적 파일은 오래 캐시, index.html 은 캐시하지 않는다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;   # React Router (새로고침·직접 진입)
    }
}
